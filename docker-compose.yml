version: '3.8'

services:
  # PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simwarga_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_NAME=SIMWarga
      - DB_HOST=db
      - DB_CONNECTION=mysql
      - DB_PORT=3306
      - DB_DATABASE=simwarga_db
      - DB_USERNAME=simwarga_user
      - DB_PASSWORD=simwarga_password
      - CACHE_DRIVER=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./:/var/www/html
      - ./storage/logs:/var/www/html/storage/logs
    ports:
      - "9000:9000"
    networks:
      - simwarga_network
    depends_on:
      - db
      - redis

  # Nginx Web Server
  nginx:
    image: nginx:latest
    container_name: simwarga_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docker/ssl:/etc/nginx/ssl
    networks:
      - simwarga_network
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: simwarga_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: simwarga_db
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_PASSWORD: simwarga_password
      MYSQL_USER: simwarga_user
      MYSQL_ROOT_HOST: '%'
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
    ports:
      - "3306:3306"
    networks:
      - simwarga_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: simwarga_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - simwarga_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5

  # PostgreSQL Database (optional alternative)
  # postgres:
  #   image: postgres:15
  #   container_name: simwarga_postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: simwarga_db
  #     POSTGRES_USER: simwarga_user
  #     POSTGRES_PASSWORD: simwarga_password
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - simwarga_network

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simwarga_queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_CONNECTION=mysql
      - DB_PORT=3306
      - DB_DATABASE=simwarga_db
      - DB_USERNAME=simwarga_user
      - DB_PASSWORD=simwarga_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - simwarga_network
    depends_on:
      - app
      - db
      - redis

  # Scheduler (optional)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simwarga_scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction &; sleep 60; done"
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_CONNECTION=mysql
      - DB_PORT=3306
      - DB_DATABASE=simwarga_db
      - DB_USERNAME=simwarga_user
      - DB_PASSWORD=simwarga_password
    networks:
      - simwarga_network
    depends_on:
      - app
      - db

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local
  # pgdata:
  #   driver: local

networks:
  simwarga_network:
    driver: bridge
